spring.application.name=BatchApplication
server.port=9030


#DB Configuration
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/spring_batch_db?useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}


spring.universitydatasource.jdbc-url=jdbc:mysql://localhost:3306/university?useSSL=false&createDatabaseIfNotExist=true
spring.universitydatasource.username=${DB_USERNAME:root}
spring.universitydatasource.password=${DB_PASSWORD:changeme}


spring.postgresdatasource.jdbc-url=jdbc:postgresql://localhost:5432/university?useSSL=false&createDatabaseIfNotExist=true
spring.postgresdatasource.username=${DB_USERNAME:postgres}
spring.postgresdatasource.password=${DB_PASSWORD:changeme}


