spring.application.name=batchapplication
server.port=8040

spring.datasource.url=jdbc:mysql://localhost:3306/Batch_Application_Db?useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.batch.jdbc.initialize-schema=always


spring.batch.job.enabled=false